<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>button:focus:not(:focus-visible){outline:none !important}</style>
</helmet>
<button type="button" aria-label="{{ aria }}" disabled="{{ inactive }}" onClick="{{ onClick }}" style="box-sizing:border-box; width:{{ size }}px; height:{{ size }}px; border:none; border-radius:50%; background:{{ bg }}; color:#FFFFFF; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:{{ cursor }}; transition:filter .15s;" style-hover="filter:{{ hf }};" style-focus="outline:3px solid #ECC725; outline-offset:3px;"><i class="ph-bold ph-caret-{{ dir }}" aria-hidden="true"></i></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:100},&quot;direction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;anterior&quot;,&quot;siguiente&quot;],&quot;default&quot;:&quot;siguiente&quot;,&quot;tsType&quot;:&quot;'anterior'|'siguiente'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;activo&quot;,&quot;inactivo&quot;],&quot;default&quot;:&quot;activo&quot;,&quot;tsType&quot;:&quot;'activo'|'inactivo'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'md'|'sm'&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const next = (p.direction ?? 'siguiente') === 'siguiente';
    const inactive = p.state === 'inactivo';
    return {
      dir: next ? 'right' : 'left',
      aria: next ? 'Siguiente' : 'Anterior',
      inactive, size: p.size === 'sm' ? 44 : 56,
      bg: inactive ? '#B7C1B5' : 'linear-gradient(135deg, #32502A 0%, #17331F 100%)',
      cursor: inactive ? 'default' : 'pointer', hf: inactive ? 'none' : 'brightness(1.2)',
      onClick: p.onClick
    };
  }
}
</script>
</body>
</html>
