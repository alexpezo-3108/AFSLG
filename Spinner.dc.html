<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes afslg-spin{to{transform:rotate(360deg)}}</style>
</helmet>
<span role="status" aria-label="{{ label }}" style="display:inline-flex; line-height:0;">{{ ring }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:80},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'|'lg'&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cargando&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const S = { sm: [16, 2], md: [24, 3], lg: [40, 4] }[p.size ?? 'md'] || [24, 3];
    const dark = p.tone === 'dark';
    return {
      label: p.label ?? 'Cargando',
      ring: React.createElement('span', { 'aria-hidden': true, style: {
        boxSizing: 'border-box', display: 'inline-block', width: S[0], height: S[0], borderRadius: '50%',
        border: `${S[1]}px solid ${dark ? 'rgba(255,255,255,0.25)' : '#E2E2E2'}`,
        borderTopColor: dark ? '#AACC4A' : '#32502A', borderRightColor: dark ? '#AACC4A' : '#32502A',
        animation: 'afslg-spin .8s linear infinite'
      } })
    };
  }
}
</script>
</body>
</html>
