<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos · Fondo Social La Granja</title>
<meta name="description" content="Reglamentos, marco normativo, actas y auditorías.">
<meta name="theme-color" content="#17331F">
<link rel="icon" type="image/png" href="assets/isotipo-orquidea.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style id="afslg-critical">html{background:#FDFCF8}html:not(.afslg-done) main{opacity:0;animation:afslgFail 0s 7s forwards}@keyframes afslgFail{to{opacity:1}}</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./site.js?v=14"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<style>html{scrollbar-gutter:stable} html.lenis,html.lenis body{height:auto} .lenis.lenis-smooth{scroll-behavior:auto !important} body{margin:0;background:#E2E2E2;overflow-x:clip} a{color:#32502A} a:hover{color:#17331F}</style>
</helmet>
<div style="display:flex; justify-content:center; width:100%;">
  <main style="width:{{ frameW }}; flex:none; zoom:{{ scale }}; background:#FDFCF8;">
    <dc-import name="EncabezadoInterno" device="{{ device }}" active="Documentos" show-filters="true" filter-layout="docs" sheet-title="Filtrar documentos" sheet-status-title="Tipo de documento" result-label="{{ resultLabel }}" chip-labels="{{ chipLabels }}" summary="{{ summary }}" updated="15 nov 2026" filters="{{ tipos }}" status-prefix="Tipo" initial-status="{{ initialStatus }}" status-nonce="{{ statusNonce }}" status-all-label="Todos" years="{{ years }}" filter-label="Busca o filtra por tipo y año" search-placeholder="Buscar documentos" on-filter-change="{{ onFilter }}" breadcrumb="{{ breadcrumb }}" title="Documentos" subtitle="Reglamentos, políticas, marco normativo y actas del Consejo Directivo del Fondo Social La Granja." hint-size="100%,520px"></dc-import>
    <dc-import name="DocumentosListado" device="{{ device }}" filter="{{ filter }}" on-summary="{{ onSummary }}" hint-size="100%,2200px"></dc-import>
    <dc-import name="CtaCierre" device="{{ device }}" image="assets/fotos/documentos-cta.webp" image-alt="Equipo del Fondo Social La Granja con la comunidad" hint-size="100%,574px"></dc-import>
    <dc-import name="Footer" device="{{ device }}" hint-size="100%,804px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { vw: window.innerWidth };
  componentDidMount() {
    this.onR = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onR);
    this.initLenis();
    const T = { reglamentos: 'Reglamentos y políticas', marco: 'Marco normativo', actas: 'Actas del Consejo Directivo', auditorias: 'Auditorías' };
    const t = T[new URLSearchParams(location.search).get('tipo')];
    this.T = T;
    if (t) this.applyTipo(t, 500);
    this.onTipo = ev => this.applyTipo(T[ev.detail] || 'Todos', 120);
    this.onPop = () => this.applyTipo(T[new URLSearchParams(location.search).get('tipo')] || 'Todos', 120);
    window.addEventListener('afslg:doc-tipo', this.onTipo); window.addEventListener('popstate', this.onPop);
  }
  applyTipo(t, delay) {
    this.setState(s => ({ filter: { status: t, year: 'todos', query: '' }, initialStatus: t, nonce: (s.nonce || 0) + 1 }));
    clearTimeout(this.st); this.st = setTimeout(() => { const g = document.getElementById('doc-grupo-0'); if (!g) return; const y = g.getBoundingClientRect().top + window.scrollY - 140; window.__lenis ? window.__lenis.scrollTo(y, { duration: 1.1 }) : window.scrollTo({ top: y, behavior: 'smooth' }); }, delay);
  }
  initLenis() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || this.lenis) return;
    if (!window.Lenis) { this.t = setTimeout(() => this.initLenis(), 200); return; }
    this.lenis = new window.Lenis({ lerp: 0.09, smoothWheel: true }); window.__lenis = this.lenis;
    const loop = t => { this.lenis && this.lenis.raf(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { window.removeEventListener('afslg:doc-tipo', this.onTipo); window.removeEventListener('popstate', this.onPop); window.removeEventListener('resize', this.onR); clearTimeout(this.t); cancelAnimationFrame(this.raf); this.lenis && this.lenis.destroy(); window.__lenis = null; }
  renderVals() {
    const device = this.props.device ?? 'auto';
    const F = { mobile: 390, laptop: 1440, desktop: 1920 }[device];
    return {
      device, frameW: F ? F + 'px' : '100%', scale: F ? Math.min(1, this.state.vw / F) : 1,
      blocks: [{ type: 'p', text: 'Compartimos el comunicado oficial del Consejo Directivo de la Asociación Fondo Social La Granja. Puedes leerlo completo o descargarlo en PDF.' }, { type: 'p', text: 'Texto del comunicado (opcional): el equipo puede pegar aquí el contenido del documento para que se pueda leer, buscar y escuchar con lectores de pantalla.' }],
      breadcrumb: [{ label: 'Documentos' }], tipos: ['Todos', 'Reglamentos y políticas', 'Marco normativo', 'Actas del Consejo Directivo', 'Auditorías'], years: ['2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017', '2016'], filter: this.state.filter || {}, initialStatus: this.state.initialStatus || '', statusNonce: this.state.nonce || 0, onFilter: f => this.setState({ filter: f }), chipLabels: { 'Actas del Consejo Directivo': 'Actas' }, summary: this.state.summary || { docs: '33 documentos', cats: '4 categorías' }, resultLabel: 'Ver ' + ((this.state.summary || {}).docs || '33 documentos'), onSummary: s => this.setState({ summary: s })
    };
  }
}
</script>
</body>
</html>
