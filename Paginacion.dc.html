<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>button:focus:not(:focus-visible){outline:none !important}</style>
</helmet>
<nav ref="{{ navRef }}" aria-label="Paginación" style="display:flex; align-items:center; justify-content:center; gap:8px; font-family:Montserrat, sans-serif;">
  <button type="button" onClick="{{ prev }}" disabled="{{ atStart }}" aria-label="Página anterior" style="display:flex; align-items:center; gap:8px; height:44px; min-width:44px; justify-content:center; padding:{{ navPad }}; box-sizing:border-box; border-radius:8px; border:1px solid {{ prevBorder }}; background:#FFFFFF; color:{{ prevFg }}; font-family:Montserrat, sans-serif; font-weight:500; font-size:15px; cursor:{{ prevCursor }};" style-focus="outline:3px solid #ECC725; outline-offset:2px;"><i class="ph ph-arrow-left" aria-hidden="true" style="font-size:15px;"></i><sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><span>Anterior</span></sc-if></button>
  <sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
    <button type="button" onClick="{{ pg.go }}" aria-label="{{ pg.aria }}" aria-current="{{ pg.current }}" style="width:44px; height:44px; border-radius:50%; border:none; background:{{ pg.bg }}; color:{{ pg.fg }}; font-family:Montserrat, sans-serif; font-weight:600; font-size:15px; cursor:pointer;" style-hover="filter:brightness(0.95);" style-focus="outline:3px solid #ECC725; outline-offset:2px;">{{ pg.n }}</button>
  </sc-for>
  <button type="button" onClick="{{ next }}" disabled="{{ atEnd }}" aria-label="Página siguiente" style="display:flex; align-items:center; gap:8px; height:44px; min-width:44px; justify-content:center; padding:{{ navPad }}; box-sizing:border-box; border-radius:8px; border:1px solid {{ nextBorder }}; background:#FFFFFF; color:{{ nextFg }}; font-family:Montserrat, sans-serif; font-weight:500; font-size:15px; cursor:{{ nextCursor }};" style-hover="border-color:#32502A;" style-focus="outline:3px solid #ECC725; outline-offset:2px;"><sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><span>Siguiente</span></sc-if><i class="ph ph-arrow-right" aria-hidden="true" style="font-size:15px;"></i></button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:80},&quot;page&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:number) =&gt; void&quot;}}">
class Component extends DCLogic {
  navRef = React.createRef();
  toTop() {
    const nav = this.navRef.current; if (!nav) return;
    const sec = nav.closest('section') || nav.parentElement;
    const run = () => { const y = sec.getBoundingClientRect().top + window.scrollY - 120; if (window.scrollY <= y) return; window.__lenis ? window.__lenis.scrollTo(y, { duration: 0.9 }) : window.scrollTo({ top: y, behavior: 'smooth' }); };
    requestAnimationFrame(() => requestAnimationFrame(run));
  }
  renderVals() {
    const p = this.props;
    const total = Math.max(1, +(p.total ?? 2)), cur = Math.min(total, Math.max(1, +(p.page ?? 1)));
    const go = n => () => { if (n === cur) return; p.onChange && p.onChange(n); this.toTop(); };
    const s = cur <= 1, e = cur >= total;
    return {
      navRef: this.navRef, showLabels: !(p.compact === true || p.compact === 'true'), navPad: (p.compact === true || p.compact === 'true') ? '0' : '0 20px',
      atStart: s, atEnd: e,
      prev: s ? undefined : go(cur - 1), next: e ? undefined : go(cur + 1),
      prevFg: s ? '#B9B9B6' : '#17331F', prevBorder: s ? '#F0F0EE' : '#E2E2E2', prevCursor: s ? 'default' : 'pointer',
      nextFg: e ? '#B9B9B6' : '#17331F', nextBorder: e ? '#F0F0EE' : '#E2E2E2', nextCursor: e ? 'default' : 'pointer',
      pages: Array.from({ length: total }, (_, i) => i + 1).map(n => ({ n, go: go(n), aria: 'Página ' + n, current: n === cur ? 'page' : undefined, bg: n === cur ? '#32502A' : 'transparent', fg: n === cur ? '#FFFFFF' : '#1C1C1B' }))
    };
  }
}
</script>
</body>
</html>
