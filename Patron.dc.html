<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; background-image:url({{ src }}); background-size:24px 24px; background-repeat:repeat; opacity:{{ opacity }};"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:200},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.tone === 'dark';
    return { src: dark ? 'assets/patron-diagonal-claro.svg' : 'assets/patron-diagonal.svg', opacity: dark ? 0.07 : 0.06 };
  }
}
</script>
</body>
</html>
