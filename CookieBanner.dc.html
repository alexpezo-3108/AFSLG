<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<sc-if value="{{ visible }}" hint-placeholder-val="{{ false }}">
  <div role="region" aria-label="Aviso de cookies" style="position:fixed; left:{{ left }}; right:{{ inset }}px; bottom:{{ inset }}px; z-index:2500; box-sizing:border-box; width:{{ w }}; padding:24px; border-radius:16px; background:#FFFFFF; box-shadow:0 12px 40px rgba(17,38,23,0.18); display:flex; flex-direction:column; gap:16px; font-family:Montserrat, sans-serif;">
    <div style="display:flex; align-items:center; gap:12px;">
      <span aria-hidden="true" style="width:40px; height:40px; border-radius:8px; background:#F1F5E4; color:#32502A; font-size:20px; display:flex; align-items:center; justify-content:center;"><i class="ph ph-cookie"></i></span>
      <h2 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:18px; color:#17331F;">Usamos cookies</h2>
    </div>
    <p style="margin:0; font-weight:500; font-size:14px; line-height:1.55; color:#4D4D4A;">Usamos cookies propias para que la web funcione correctamente y para conocer cómo se usa. Puedes aceptarlas todas o quedarte solo con las necesarias. Más información en nuestra <a href="Privacidad.dc.html" style="font-weight:700; color:#17331F;">Política de cookies</a>.</p>
    <div style="display:flex; flex-direction:{{ dir }}; gap:8px;">
      <button type="button" onClick="{{ acceptAll }}" style="flex:1; height:44px; border:0; border-radius:8px; background:linear-gradient(100deg, #DDEA2C 0%, #C4DC3A 45%, #AACC4A 100%); font-family:Montserrat, sans-serif; font-weight:700; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:#17331F; cursor:pointer;" style-hover="filter:brightness(1.06);">Aceptar todas</button>
      <button type="button" onClick="{{ acceptNeeded }}" style="flex:1; height:44px; border:1px solid #E2E2E2; border-radius:8px; background:#FFFFFF; font-family:Montserrat, sans-serif; font-weight:700; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:#17331F; cursor:pointer;" style-hover="background:#F7F7F5;">Solo necesarias</button>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { done: (() => { try { return !!localStorage.getItem('afslg-cookies'); } catch (e) { return false; } })(), vw: window.innerWidth };
  componentDidMount() { this.onR = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  save(v) { try { localStorage.setItem('afslg-cookies', v); } catch (e) {} this.setState({ done: true }); }
  renderVals() {
    const m = this.state.vw < 768;
    return {
      visible: !this.state.done, inset: m ? 12 : 24, left: m ? '12px' : 'auto', w: m ? 'auto' : '400px', dir: m ? 'column' : 'row',
      acceptAll: () => this.save('todas'), acceptNeeded: () => this.save('necesarias')
    };
  }
}
</script>
</body>
</html>
