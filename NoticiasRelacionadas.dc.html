<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<section ref="{{ rootRef }}" aria-labelledby="rel-titulo" style="position:relative; width:100%; background:#FDFCF8; isolation:isolate; overflow:hidden;">
  <dc-import name="Patron" tone="light" style="position:absolute; inset:0; z-index:-1;" hint-size="100%,100%"></dc-import>
  <div style="box-sizing:border-box; padding:{{ padT }}px {{ mx }}px {{ padB }}px; display:flex; flex-direction:column; gap:{{ headGap }}px;">
    <header style="display:flex; flex-direction:{{ headDir }}; align-items:{{ headAlign }}; justify-content:space-between; gap:{{ headInner }}px;">
      <h2 id="rel-titulo" style="margin:0; font-family:Poppins, sans-serif; font-weight:700; font-size:{{ h2 }}px; line-height:1.15; letter-spacing:-0.02em; color:#17331F;">{{ titleStart }} <span style="color:#758434;">{{ titleHighlight }}</span></h2>
      <dc-import name="Button" variant="link" label="{{ linkLabel }}" href="{{ linkHref }}" hint-size="230px,44px"></dc-import>
    </header>
    <ul data-lenis-prevent="true" style="list-style:none; margin:0 {{ bleed }}; padding:{{ listPad }}; display:{{ listDisplay }}; grid-template-columns:{{ cols }}; gap:{{ gridGap }}px; overflow-x:{{ ovx }}; scroll-snap-type:x mandatory; scroll-padding-left:{{ mx }}px; scrollbar-width:none;">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="3">
        <li style="display:flex; flex:none; width:{{ itemW }}; scroll-snap-align:start;">
            <article style="width:100%; display:flex; flex-direction:column; border-radius:20px; overflow:hidden; background:#FFFFFF; box-shadow:0 1px 2px rgba(17,38,23,0.04);">
              <div data-shine="" style="position:relative; height:{{ imgH }}px; background:#E2E2E2; display:flex; align-items:center; justify-content:center; flex:none;">
                <sc-if value="{{ n.hasImage }}" hint-placeholder-val="{{ false }}"><img src="{{ n.image }}" alt="{{ n.imageAlt }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
                <sc-if value="{{ n.noImage }}" hint-placeholder-val="{{ true }}"><i class="ph ph-image" aria-hidden="true" style="font-size:30px; color:#A9A9A6;"></i></sc-if>
              </div>
              <div style="flex:1; display:flex; flex-direction:column; gap:12px; padding:{{ bodyPad }};">
                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:12px; font-family:Montserrat, sans-serif;">
                  <span style="padding:4px 10px; border-radius:6px; background:{{ n.badgeBg }}; color:{{ n.badgeFg }}; font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase;">{{ n.type }}</span>
                  <span style="display:flex; align-items:center; gap:6px; font-weight:500; font-size:13px; color:#4D4D4A;"><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:14px;"></i><time>{{ n.date }}</time></span>
                </div>
                <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:{{ titleSize }}px; line-height:1.3; color:#17331F; text-wrap:pretty;"><a href="{{ n.href }}" style="color:inherit; text-decoration:none;" style-hover="text-decoration:underline;">{{ n.title }}</a></h3>
                <p style="margin:0; font-family:Montserrat, sans-serif; font-weight:500; font-size:14px; line-height:1.6; color:#4D4D4A; text-wrap:pretty;">{{ n.excerpt }}</p>
                <div style="margin-top:auto; padding-top:12px; display:flex;">
                  <dc-import name="Button" variant="secundario-claro" label="Leer noticia" href="{{ n.href }}" full-width="true" shadow="false" hint-size="100%,44px"></dc-import>
                </div>
              </div>
            </article>
        </li>
      </sc-for>
    </ul>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleStart&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Noticias&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleHighlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;relacionadas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ver todas las noticias&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Noticias.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{type,date,title,excerpt,image?,href}[]&quot;}}">
class Component extends DCLogic {
  state = { auto: 'laptop' };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!window.ResizeObserver) return;
    if (!this._iv) this._iv = setInterval(() => { const n = this.rootRef.current; if (n && n !== this._obsEl) this.componentDidMount(); else if (n && this._measure) this._measure(n.offsetWidth); }, 400);
    if (!el) { this._rt = setTimeout(() => this.componentDidMount(), 100); return; }
    if (this.ro && this._obsEl === el) return;
    if (this.ro) this.ro.disconnect();
    this._obsEl = el;
    this._measure = (w) => {
      const d = w < 768 ? 'mobile' : w < 1680 ? 'laptop' : 'desktop';
      const cols = w < 1100 ? 2 : 3;
      if (d !== this.state.auto || cols !== this.state.cols) this.setState({ auto: d, cols });
    };
    this.ro = new ResizeObserver(([e]) => this._measure(e.contentRect.width));
    this.ro.observe(el);
    this._measure(el.offsetWidth);
    if (!this._onWin) { this._onWin = () => { const n = this.rootRef.current; if (n && this._measure) this._measure(n.offsetWidth); }; window.addEventListener('resize', this._onWin); }
  }
  componentWillUnmount() { clearInterval(this._iv); this._onWin && window.removeEventListener('resize', this._onWin); this.ro && this.ro.disconnect(); }
  renderVals() {
    const p = this.props;
    const isAuto = !p.device || p.device === 'auto';
    const dev = isAuto ? this.state.auto : p.device;
    const m = dev === 'mobile', d = dev === 'desktop';
    const cols = isAuto ? (this.state.cols ?? 3) : 3;
    const C = 'Comunicado';
    const all = (p.items ?? [
      { type: 'Noticia', date: '20 oct 2026', title: 'Capacitamos a productores de Checos en manejo de pastos', excerpt: 'Más de 40 familias participaron en la jornada técnica realizada en el local comunal.' },
      { type: C, date: '17 oct 2026', title: 'Resultados de la licitación pública N° 009-2026', excerpt: 'Publicamos el acta de otorgamiento de la buena pro y los pasos siguientes del proceso.' },
      { type: 'Noticia', date: '12 oct 2026', title: 'Avanza la instalación de aulas prefabricadas en La Pampa', excerpt: 'La obra beneficiará a estudiantes de nivel inicial del centro poblado.' }
    ]).map(x => ({ image: '', imageAlt: '', ...x, href: (!x.href || x.href === '#') ? (x.type === C ? 'Comunicado%20Detalle.dc.html' : 'Noticia%20Detalle.dc.html') : x.href, hasImage: !!x.image, noImage: !x.image, badgeBg: x.type === C ? 'linear-gradient(135deg, #4C6E3B 0%, #32502A 55%, #22402A 100%)' : 'linear-gradient(135deg, #F4DC6A 0%, #ECC725 55%, #DDB71A 100%)', badgeFg: x.type === C ? '#FFFFFF' : '#17331F' }));
    const mx = { mobile: 20, laptop: 56, desktop: 160 }[dev];
    return {
      rootRef: this.rootRef, items: m ? all : all.slice(0, cols),
      mx, padT: m ? 56 : 96, padB: m ? 64 : 112,
      headGap: m ? 28 : 48, headDir: m ? 'column' : 'row', headAlign: m ? 'flex-start' : 'center', headInner: m ? 12 : 24,
      h2: m ? 28 : (d ? 52 : 44),
      listDisplay: m ? 'flex' : 'grid', cols: 'repeat(' + cols + ', minmax(0, 1fr))', gridGap: m ? 16 : 24,
      ovx: m ? 'auto' : 'visible', bleed: m ? '-' + mx + 'px' : '0', listPad: m ? '0 ' + mx + 'px' : '0', itemW: m ? '280px' : 'auto',
      imgH: m ? 170 : (d ? 315 : 260), bodyPad: m ? '20px 24px 24px' : '20px 24px 24px', titleSize: m ? 15 : 17,
      titleStart: p.titleStart ?? 'Noticias', titleHighlight: p.titleHighlight ?? 'relacionadas',
      linkLabel: p.linkLabel ?? 'Ver todas las noticias', linkHref: p.linkHref ?? 'Noticias.dc.html'
    };
  }
}
</script>
</body>
</html>
