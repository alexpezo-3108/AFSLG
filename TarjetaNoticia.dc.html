<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>a:focus:not(:focus-visible){outline:none !important}</style>
</helmet>
<sc-if value="{{ isFeatured }}" hint-placeholder-val="{{ true }}">
  <article style="box-sizing:border-box; height:100%; display:flex; flex-direction:column; padding:10px; border-radius:20px; background:#FFFFFF; box-shadow:0 1px 2px rgba(17,38,23,0.04); transition:box-shadow .3s ease;" style-hover="box-shadow:0 4px 14px rgba(17,38,23,0.05);">
    <a href="{{ href }}" tabindex="-1" aria-hidden="true" data-shine="" style="position:relative; height:{{ imgH }}px; border-radius:14px; overflow:hidden; background:#ECECEA; display:flex; align-items:center; justify-content:center; flex:none;">
      <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}"><img src="{{ image }}" alt="{{ imageAlt }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
      <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}"><i class="ph ph-image" aria-hidden="true" style="font-size:40px; color:#A9A9A6;"></i></sc-if>
      <span style="position:absolute; top:14px; left:14px; padding:5px 12px; border-radius:6px; background:linear-gradient(135deg, #F4DC6A 0%, #ECC725 55%, #DDB71A 100%); color:#17331F; font-family:Montserrat, sans-serif; font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase;">{{ type }}</span>
    </a>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:{{ fGap }}px; padding:{{ fPad }};">
      <span style="display:flex; align-items:center; gap:6px; font-family:Montserrat, sans-serif; font-weight:500; font-size:14px; color:#707070;"><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:15px;"></i><time datetime="{{ datetime }}">{{ date }}</time></span>
      <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:{{ fTitle }}px; line-height:1.25; letter-spacing:-0.01em; color:#17331F; text-wrap:pretty;"><a href="{{ href }}" style="color:inherit; text-decoration:none;" style-hover="text-decoration:underline;" style-focus="outline:3px solid #ECC725; outline-offset:2px;">{{ title }}</a></h3>
      <p style="margin:0; font-family:Montserrat, sans-serif; font-weight:500; font-size:16px; line-height:1.65; color:#4D4D4A; text-wrap:pretty;">{{ excerpt }}</p>
      <div style="margin-top:6px; display:flex;">
        <dc-import name="Button" variant="secundario-claro" label="{{ ctaLabel }}" href="{{ href }}" hint-size="140px,44px"></dc-import>
      </div>
    </div>
  </article>
</sc-if>
<sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
  <a href="{{ href }}" style="box-sizing:border-box; height:100%; display:flex; align-items:center; gap:{{ cGap }}px; padding:{{ cPad }}; border-radius:16px; background:#FFFFFF; text-decoration:none; color:inherit; box-shadow:0 1px 2px rgba(17,38,23,0.04); transition:box-shadow .15s;" style-hover="box-shadow:0 4px 14px rgba(17,38,23,0.05);" style-focus="outline:3px solid #ECC725; outline-offset:3px;">
    <div data-shine="" style="position:relative; width:{{ thumb }}px; height:{{ thumb }}px; flex:none; align-self:stretch; min-height:{{ thumb }}px; max-height:{{ thumbMax }}; border-radius:12px; overflow:hidden; background:#ECECEA; display:flex; align-items:center; justify-content:center;">
      <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}"><img src="{{ image }}" alt="{{ imageAlt }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
      <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}"><i class="ph ph-image" aria-hidden="true" style="font-size:{{ phIcon }}px; color:#A9A9A6;"></i></sc-if>
    </div>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:{{ cInner }}px;">
      <sc-if value="{{ isMd }}" hint-placeholder-val="{{ true }}">
      <span style="font-family:Montserrat, sans-serif; font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#758434;">{{ type }}</span>
      </sc-if>
      <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:{{ cTitle }}px; line-height:1.3; color:#17331F; text-wrap:pretty;">{{ title }}</h3>
      <sc-if value="{{ isMd }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex; align-items:center; gap:6px; margin-top:4px; font-family:Montserrat, sans-serif; font-weight:500; font-size:13px; color:#707070;"><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:14px;"></i><time datetime="{{ datetime }}">{{ date }}</time></span>
      </sc-if>
      <sc-if value="{{ isSm }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-family:Montserrat, sans-serif; font-weight:500; font-size:13px; color:#707070;"><span style="font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#758434;">{{ type }}</span><span aria-hidden="true" style="color:#A9A9A6;">•</span><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:14px;"></i><time datetime="{{ datetime }}">{{ date }}</time></span>
      </sc-if>
    </div>
    <sc-if value="{{ isMd }}" hint-placeholder-val="{{ true }}">
    <span aria-hidden="true" style="width:{{ arrow }}px; height:{{ arrow }}px; flex:none; margin-right:{{ arrowMr }}px; border-radius:50%; background:linear-gradient(135deg, #32502A 0%, #17331F 100%); color:#FFFFFF; font-size:{{ arrowIcon }}px; display:flex; align-items:center; justify-content:center;"><i class="ph-bold ph-arrow-right"></i></span>
    </sc-if>
  </a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:720},&quot;format&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;destacada&quot;,&quot;compacta&quot;],&quot;default&quot;:&quot;destacada&quot;,&quot;tsType&quot;:&quot;'destacada'|'compacta'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'md'|'sm'&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Noticia&quot;,&quot;Comunicado&quot;],&quot;default&quot;:&quot;Noticia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Entregamos kits escolares a estudiantes de nuestra zona de influencia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;excerpt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Más de 600 estudiantes de los centros poblados recibieron útiles para iniciar el año escolar con todo lo necesario.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;24 oct 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;datetime&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imageAlt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Leer noticia&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const sm = p.size === 'sm';
    const featured = (p.format ?? 'destacada') === 'destacada';
    const image = p.image || '';
    return {
      isSm: sm, isMd: !sm,
      isFeatured: featured, isCompact: !featured,
      hasImage: !!image, noImage: !image, image, imageAlt: p.imageAlt ?? '',
      type: p.type ?? 'Noticia',
      title: p.title ?? 'Entregamos kits escolares a estudiantes de nuestra zona de influencia',
      excerpt: p.excerpt ?? 'Más de 600 estudiantes de los centros poblados recibieron útiles para iniciar el año escolar con todo lo necesario.',
      date: p.date ?? '24 oct 2026', datetime: p.datetime ?? '',
      href: p.href ?? 'Noticia%20Detalle.dc.html', ctaLabel: p.ctaLabel ?? 'Leer noticia',
      imgH: sm ? 200 : 400, fPad: sm ? '20px 12px 14px' : '28px 24px 24px', fGap: sm ? 12 : 14, fTitle: sm ? 20 : 26,
      cGap: sm ? 16 : 24, cPad: sm ? '12px' : '10px', thumb: sm ? 96 : 143, thumbMax: sm ? '96px' : '143px',
      phIcon: sm ? 26 : 32, cInner: sm ? 8 : 8, cTitle: sm ? 15 : 18,
      arrow: sm ? 32 : 40, arrowIcon: sm ? 14 : 16, arrowMr: sm ? 4 : 22
    };
  }
}
</script>
</body>
</html>
