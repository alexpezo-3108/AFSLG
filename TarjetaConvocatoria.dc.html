<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<article style="box-sizing:border-box; height:100%; display:flex; flex-direction:column; padding:12px; border-radius:20px; background:#FFFFFF; box-shadow:0 1px 2px rgba(17,38,23,0.04);">
  <div style="position:relative; aspect-ratio:1 / 1; border-radius:14px; overflow:hidden; background:#F7F7F7; display:flex; align-items:center; justify-content:center; isolation:isolate;">
    <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}"><img src="{{ image }}" alt="{{ imageAlt }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
    <sc-if value="{{ showCover }}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position:absolute; inset:0; z-index:-1; background:radial-gradient(ellipse 80% 60% at 85% 10%, rgba(117,132,52,0.55) 0%, rgba(117,132,52,0) 70%), linear-gradient(160deg, #1F3B23 0%, #17331F 55%, #122818 100%);"></div>
      <dc-import name="Patron" tone="dark" style="position:absolute; inset:0; z-index:-1;" hint-size="100%,100%"></dc-import>
      <div style="display:flex; flex-direction:column; align-items:center; gap:12px; padding:24px; text-align:center;">
        <span style="font-family:Montserrat, sans-serif; font-weight:600; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#AACC4A;">{{ kind }}</span>
        <span style="font-family:Poppins, sans-serif; font-weight:600; font-size:{{ coverNum }}px; line-height:1.1; color:#FFFFFF;">{{ number }}</span>
        <span aria-hidden="true" style="width:40px; height:2px; background:#ECC725; margin:4px 0;"></span>
        <span style="max-width:220px; font-family:Montserrat, sans-serif; font-weight:500; font-size:13px; line-height:1.55; color:rgba(255,255,255,0.75);">{{ coverText }}</span>
        <img src="assets/logo-fslg-blanco.png" alt="" style="height:30px; width:auto; margin-top:16px; opacity:0.85;">
      </div>
    </sc-if>
    <sc-if value="{{ showPh }}" hint-placeholder-val="{{ true }}"><i class="ph ph-image" aria-hidden="true" style="font-size:30px; color:#A9A9A6;"></i></sc-if>
    <span style="position:absolute; top:16px; left:16px; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:6px; background:{{ badgeBg }}; color:{{ badgeFg }}; font-family:Montserrat, sans-serif; font-weight:700; font-size:12px; box-shadow:{{ badgeShadow }};">
      <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:6px; height:6px; border-radius:50%; background:#AACC4A;"></span></sc-if>{{ statusLabel }}
    </span>
  </div>
  <div style="display:flex; flex-direction:column; gap:10px; padding:{{ bodyPad }};">
    <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:{{ titleSize }}px; line-height:1.3; color:#17331F; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:{{ clamp }}; overflow:hidden; text-wrap:pretty;"><a href="{{ href }}" style="color:inherit; text-decoration:none;" style-hover="text-decoration:underline;">{{ title }}</a></h3>
    <span style="display:flex; align-items:center; gap:6px; font-family:Montserrat, sans-serif; font-weight:500; font-size:13px; color:#707070;"><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:14px;"></i>Publicado el <time datetime="{{ datetime }}">{{ date }}</time></span>
  </div>
  <div style="margin-top:auto; display:flex;">
    <dc-import name="Button" variant="secundario-claro" label="{{ ctaLabel }}" href="{{ href }}" full-width="true" shadow="false" hint-size="100%,44px"></dc-import>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:680},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;abierta&quot;,&quot;en-evaluacion&quot;,&quot;finalizada&quot;],&quot;default&quot;:&quot;abierta&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Licitación pública N.° 013-2026 – Mejoramiento del camino vecinal La Granja – Checos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18 oct 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imageAlt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Licitación pública&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;number&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ver convocatoria&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.status ?? 'abierta';
    const S = {
      'abierta': { label: 'Abierta', bg: 'linear-gradient(100deg, #5E8A2E 0%, #32502A 100%)', fg: '#FFFFFF', sh: '0 2px 6px rgba(17,38,23,0.25)' },
      'en-evaluacion': { label: 'En evaluación', bg: '#ECC725', fg: '#17331F', sh: 'none' },
      'finalizada': { label: 'Finalizada', bg: '#E2E2E2', fg: '#4D4D4A', sh: 'none' }
    }[st] || {};
    const sm = p.size === 'sm';
    const image = p.image || '';
    const cover = !image && (p.cover === true || p.cover === 'true') && !!p.number;
    return {
      hasImage: !!image, showCover: cover, showPh: !image && !cover, image, imageAlt: p.imageAlt ?? '',
      kind: p.kind ?? 'Licitación pública', number: p.number ?? '', coverText: p.coverText ?? 'Revisa las bases y documentos dentro de la convocatoria',
      coverNum: sm ? 28 : 34,
      statusLabel: S.label, badgeBg: S.bg, badgeFg: S.fg, badgeShadow: S.sh, isOpen: st === 'abierta',
      title: p.title ?? 'Licitación pública N.° 013-2026 – Mejoramiento del camino vecinal La Granja – Checos',
      date: p.date ?? '18 oct 2026', datetime: p.datetime ?? '', href: p.href ?? 'Convocatoria%20Detalle.dc.html',
      ctaLabel: p.ctaLabel ?? 'Ver convocatoria',
      titleSize: sm ? 15 : 18, clamp: sm ? 3 : 4, bodyPad: sm ? '16px 6px 24px' : '20px 8px 28px'
    };
  }
}
</script>
</body>
</html>
