<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>a:focus:not(:focus-visible){outline:none !important}</style>
</helmet>
<section ref="{{ rootRef }}" aria-label="Documento" style="position:relative; width:100%; background:#FDFCF8; isolation:isolate;">
  <dc-import name="Patron" tone="light" style="position:absolute; inset:0; z-index:-1;" hint-size="100%,100%"></dc-import>
  <div style="box-sizing:border-box; padding:0 {{ mx }}px {{ padB }}px; display:flex; flex-direction:column; gap:{{ gap }}px;">
    <div style="position:relative; height:{{ viewerH }}; border-radius:{{ radius }}px; overflow:hidden; background:#525659;">
      <iframe src="{{ viewSrc }}" title="{{ iframeTitle }}" loading="lazy" style="display:block; width:100%; height:100%; border:0;"></iframe>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <a href="{{ src }}" target="_blank" rel="noopener" aria-label="Abrir el PDF en pantalla completa" style="position:absolute; right:12px; bottom:12px; display:flex; align-items:center; gap:8px; height:44px; padding:0 16px; border-radius:22px; background:#17331F; color:#FFFFFF; font-family:Montserrat, sans-serif; font-weight:700; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,0.25);" style-focus="outline:3px solid #ECC725; outline-offset:2px;"><i class="ph ph-arrows-out" aria-hidden="true" style="font-size:16px;"></i>Pantalla completa</a>
      </sc-if>
    </div>
    <div style="display:flex; align-items:center; gap:16px; padding:{{ cardPad }}; border-radius:{{ cardR }}px; background:{{ cardBg }};">
      <span aria-hidden="true" style="flex:none; width:48px; height:48px; border-radius:10px; background:linear-gradient(160deg, #EE6A5F 0%, #D63A32 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; color:#FFFFFF; box-shadow:0 2px 6px rgba(17,38,23,0.12);"><i class="ph-fill ph-file" style="font-size:18px;"></i><span style="font-family:Montserrat, sans-serif; font-weight:700; font-size:8px;">PDF</span></span>
      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
        <span style="font-family:Poppins, sans-serif; font-weight:600; font-size:{{ titleSize }}px; line-height:1.3; color:#17331F; text-wrap:pretty;">{{ title }}</span>
        <span style="font-family:Montserrat, sans-serif; font-weight:500; font-size:13px; color:#707070;">{{ meta }}</span>
      </div>
      <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
        <a href="{{ src }}" download="{{ fileName }}" style="flex:none; display:flex; align-items:center; gap:8px; min-height:44px; padding:0 4px; font-family:Montserrat, sans-serif; font-weight:700; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; color:#17331F; text-decoration:none;" style-hover="text-decoration:underline;" style-focus="outline:3px solid #ECC725; outline-offset:2px;"><i class="ph ph-download-simple" aria-hidden="true" style="font-size:18px;"></i>Descargar PDF</a>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <a href="{{ src }}" download="{{ fileName }}" aria-label="Descargar PDF" style="flex:none; width:44px; height:44px; box-sizing:border-box; border-radius:50%; border:1px solid #E2E2E2; background:#FFFFFF; display:flex; align-items:center; justify-content:center; color:#17331F; font-size:18px;" style-focus="outline:3px solid #ECC725; outline-offset:2px;"><i class="ph ph-download-simple" aria-hidden="true"></i></a>
      </sc-if>
    </div>
    <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:12px; padding:14px 20px; border-radius:12px; background:#F6F3EA; font-family:Montserrat, sans-serif; font-weight:500; font-size:15px; line-height:1.55; color:#1C1C1B;">
        <i class="ph-fill ph-info" aria-hidden="true" style="flex:none; font-size:20px; color:#32502A;"></i><span>{{ note }}</span>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/docs/comunicado-cd-26052025.pdf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Comunicado del Consejo Directivo – 26 de mayo de 2025&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pages&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;fileSize&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;380 KB&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Si el documento no carga, descárgalo con el botón “Descargar PDF”.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { auto: 'laptop' };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!window.ResizeObserver) return;
    if (!this._iv) this._iv = setInterval(() => { const n = this.rootRef.current; if (n && n !== this._obsEl) this.componentDidMount(); else if (n && this._measure) this._measure(n.offsetWidth); }, 400);
    if (!el) { this._rt = setTimeout(() => this.componentDidMount(), 100); return; }
    if (this.ro && this._obsEl === el) return;
    if (this.ro) this.ro.disconnect();
    this._obsEl = el;
    this._measure = (w) => {
      const d = w < 768 ? 'mobile' : w < 1680 ? 'laptop' : 'desktop';
      if (d !== this.state.auto) this.setState({ auto: d });
    };
    this.ro = new ResizeObserver(([e]) => this._measure(e.contentRect.width));
    this.ro.observe(el);
    this._measure(el.offsetWidth);
    if (!this._onWin) { this._onWin = () => { const n = this.rootRef.current; if (n && this._measure) this._measure(n.offsetWidth); }; window.addEventListener('resize', this._onWin); }
  }
  componentWillUnmount() { clearInterval(this._iv); this._onWin && window.removeEventListener('resize', this._onWin); this.ro && this.ro.disconnect(); clearTimeout(this._rt); }
  renderVals() {
    const p = this.props;
    const dev = (p.device && p.device !== 'auto') ? p.device : this.state.auto;
    const m = dev === 'mobile', d = dev === 'desktop';
    const src = p.src ?? 'assets/docs/comunicado-cd-26052025.pdf';
    const fileName = p.fileName ?? src.split('/').pop();
    const title = p.title ?? 'Comunicado del Consejo Directivo – 26 de mayo de 2025';
    const meta = ['PDF', p.pages ? p.pages + (p.pages == 1 ? ' página' : ' páginas') : '', p.fileSize ?? ''].filter(Boolean).join(' · ');
    return {
      rootRef: this.rootRef, isMobile: m, isWide: !m,
      src, viewSrc: src + '#view=FitH&navpanes=0', fileName, title, meta, iframeTitle: 'Visor PDF: ' + title,
      mx: { mobile: 20, laptop: 56, desktop: 160 }[dev], padB: m ? 56 : 96, gap: m ? 16 : 16,
      viewerH: m ? '480px' : (d ? '956px' : '900px'), radius: m ? 16 : 20,
      cardPad: m ? '16px' : '16px 24px', cardR: m ? 20 : 0, cardBg: m ? '#FFFFFF' : 'transparent', titleSize: m ? 16 : 18,
      note: p.note ?? 'Si el documento no carga, descárgalo con el botón “Descargar PDF”.'
    };
  }
}
</script>
</body>
</html>
