<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<section ref="{{ rootRef }}" aria-label="Listado de convocatorias" style="position:relative; width:100%; background:#FDFCF8; isolation:isolate;">
  <dc-import name="Patron" tone="light" style="position:absolute; inset:0; z-index:-1;" hint-size="100%,100%"></dc-import>
  <div style="box-sizing:border-box; padding:{{ padT }}px {{ mx }}px {{ padB }}px; display:flex; flex-direction:column; gap:{{ gapA }}px;">
    <p aria-live="polite" style="margin:0; font-family:Montserrat, sans-serif; font-weight:500; font-size:{{ countSize }}px; color:#4D4D4A; text-align:{{ countAlign }};">{{ countText }}</p>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
      <ul style="list-style:none; margin:0; padding:0; display:grid; grid-template-columns:{{ cols }}; gap:16px;">
        <sc-for list="{{ items }}" as="c" hint-placeholder-count="6">
          <li style="display:flex;">
            <dc-import name="TarjetaConvocatoria" size="{{ cardSize }}" status="{{ c.status }}" title="{{ c.title }}" date="{{ c.date }}" image="{{ c.image }}" cover="{{ c.cover }}" kind="{{ c.kind }}" number="{{ c.number }}" href="{{ c.href }}" style="width:100%;" hint-size="100%,680px"></dc-import>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; align-items:center; gap:12px; padding:72px 24px; border-radius:20px; background:#FFFFFF; text-align:center;">
        <i class="ph ph-magnifying-glass" aria-hidden="true" style="font-size:36px; color:#758434;"></i>
        <h2 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:22px; color:#17331F;">No encontramos convocatorias</h2>
        <p style="margin:0; max-width:420px; font-family:Montserrat, sans-serif; font-weight:500; font-size:15px; line-height:1.6; color:#4D4D4A;">Prueba con otro estado, otro año o una búsqueda diferente.</p>
      </div>
    </sc-if>
    <sc-if value="{{ hasPages }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:{{ pagTop }}px;">
        <dc-import name="Paginacion" page="{{ page }}" total="{{ totalPages }}" compact="{{ isMobile }}" on-change="{{ onPage }}" hint-size="100%,44px"></dc-import>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;perPage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;filter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{status,year,query}&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{status,title,date,year,image?,cover?,kind?,number?,href}[]&quot;}}">
class Component extends DCLogic {
  state = { auto: 'laptop', page: 1, key: '' };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!window.ResizeObserver) return;
    if (!this._iv) this._iv = setInterval(() => { const n = this.rootRef.current; if (n && n !== this._obsEl) this.componentDidMount(); else if (n && this._measure) this._measure(n.offsetWidth); }, 400);
    if (!el) { this._rt = setTimeout(() => this.componentDidMount(), 100); return; }
    if (this.ro && this._obsEl === el) return;
    if (this.ro) this.ro.disconnect();
    this._obsEl = el;
    this._measure = (w) => {
      const d = w < 768 ? 'mobile' : w < 1680 ? 'laptop' : 'desktop';
      const cols = w < 768 ? 1 : w < 1100 ? 2 : 3;
      if (d !== this.state.auto || cols !== this.state.cols) this.setState({ auto: d, cols });
    };
    this.ro = new ResizeObserver(([e]) => this._measure(e.contentRect.width));
    this.ro.observe(el);
    this._measure(el.offsetWidth);
    if (!this._onWin) { this._onWin = () => { const n = this.rootRef.current; if (n && this._measure) this._measure(n.offsetWidth); }; window.addEventListener('resize', this._onWin); }
  }
  componentWillUnmount() { clearInterval(this._iv); this._onWin && window.removeEventListener('resize', this._onWin); this.ro && this.ro.disconnect(); }
  renderVals() {
    const p = this.props;
    const isAuto = !p.device || p.device === 'auto';
    const dev = isAuto ? this.state.auto : p.device;
    const m = dev === 'mobile';
    const cols = isAuto ? (this.state.cols ?? 3) : (m ? 1 : 3);
    const all = p.items ?? [
      { status: 'abierta', title: 'Licitación pública N.° 013-2026 – Mejoramiento del camino vecinal La Granja – Checos', date: '18 oct 2026', year: '2026' },
      { status: 'abierta', title: 'Comparativo de precios N.° 004-2026 – Materiales para invernaderos comunales', date: '15 oct 2026', year: '2026' },
      { status: 'en-evaluacion', title: 'Licitación pública N.° 012-2026 – Tuberías PVC-U para 29 canales de regadío', date: '18 ago 2026', year: '2026' },
      { status: 'finalizada', title: 'Comparativo de precios – Tercera convocatoria: Creación de cobertura metálica sobre losa deportiva de la I.E. N.° 10851', date: '24 set 2026', year: '2026' },
      { status: 'finalizada', title: 'Licitación pública N.° 010-2026 – 2.ª convocatoria – Expediente técnico I.E. N.° 10851', date: '24 jul 2026', year: '2026', cover: true, kind: 'Licitación pública', number: 'N.° 010-2026' },
      { status: 'finalizada', title: 'Licitación pública N.° 009-2026 – 3.ª convocatoria – Salón multiuso comunidad Checos', date: '24 jul 2026', year: '2026' },
      { status: 'finalizada', title: 'Licitación pública N.° 008-2026 – Equipamiento de cocinas comunales', date: '02 jul 2026', year: '2026' },
      { status: 'finalizada', title: 'Comparativo de precios N.° 003-2026 – Semillas certificadas para campaña agrícola', date: '18 jun 2026', year: '2026' },
      { status: 'finalizada', title: 'Licitación pública N.° 007-2026 – Mejoramiento de reservorio en Pampa Grande', date: '30 may 2026', year: '2026' },
      { status: 'finalizada', title: 'Licitación pública N.° 015-2025 – Aulas prefabricadas I.E. de La Pampa', date: '12 dic 2025', year: '2025' },
      { status: 'finalizada', title: 'Comparativo de precios N.° 009-2025 – Kits escolares 2026', date: '20 nov 2025', year: '2025' },
      { status: 'finalizada', title: 'Licitación pública N.° 011-2024 – Sistema de agua potable Checos Alto', date: '05 oct 2024', year: '2024' }
    ];
    const f = p.filter || {};
    const map = { 'Abiertas': 'abierta', 'En evaluación': 'en-evaluacion', 'Finalizadas': 'finalizada' };
    const q = (f.query || '').trim().toLowerCase();
    const order = { 'abierta': 0, 'en-evaluacion': 1, 'finalizada': 2 };
    const list = all.filter(x => (!map[f.status] || x.status === map[f.status]) && (!f.year || f.year === 'todos' || x.year === f.year) && (!q || x.title.toLowerCase().includes(q)) && (!f.kind || f.kind === 'Todos' || (x.kind || x.title).toLowerCase().includes(f.kind.toLowerCase())))
      .sort((a, b) => order[a.status] - order[b.status]);
    if (p.onTotal && this._tot !== list.length) { this._tot = list.length; const n = list.length; setTimeout(() => p.onTotal(n)); }
    const per = +(p.perPage ?? 6);
    const key = JSON.stringify(f);
    if (key !== this.state.key) setTimeout(() => this.setState({ key, page: 1 }));
    const totalPages = Math.max(1, Math.ceil(list.length / per));
    const page = Math.min(this.state.page, totalPages);
    const items = list.slice((page - 1) * per, page * per).map(x => ({ image: '', cover: false, kind: 'Licitación pública', number: '', ...x, href: (!x.href || x.href === '#') ? 'Convocatoria%20Detalle.dc.html' : x.href }));
    return {
      rootRef: this.rootRef, isMobile: m, items, hasItems: items.length > 0, isEmpty: items.length === 0,
      mx: { mobile: 16, laptop: 56, desktop: 160 }[dev], padT: m ? 24 : 40, padB: m ? 64 : 120, gapA: m ? 20 : 24,
      countSize: m ? 12 : 14, countAlign: m ? 'center' : 'left',
      countText: 'Mostrando ' + items.length + ' de ' + list.length + ' convocatorias · Abiertas primero',
      cols: 'repeat(' + cols + ', minmax(0, 1fr))', cardSize: m ? 'sm' : 'md',
      page, totalPages, hasPages: totalPages > 1, pagTop: m ? 32 : 48,
      onPage: n => { this.setState({ page: n }); const el = this.rootRef.current; if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 16; window.__lenis ? window.__lenis.scrollTo(y) : window.scrollTo({ top: y, behavior: 'smooth' }); } }
    };
  }
}
</script>
</body>
</html>
