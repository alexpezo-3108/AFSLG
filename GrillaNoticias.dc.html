<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<section ref="{{ rootRef }}" aria-labelledby="mas-noticias" style="position:relative; width:100%; background:#FDFCF8; isolation:isolate;">
  <dc-import name="Patron" tone="light" style="position:absolute; inset:0; z-index:-1;" hint-size="100%,100%"></dc-import>
  <div style="box-sizing:border-box; padding:{{ padT }}px {{ mx }}px {{ padB }}px; display:flex; flex-direction:column; gap:{{ headGap }}px;">
    <header style="display:flex; flex-direction:{{ headDir }}; align-items:{{ headAlign }}; justify-content:space-between; gap:{{ headInner }}px;">
      <h2 id="mas-noticias" style="margin:0; font-family:Poppins, sans-serif; font-weight:700; font-size:{{ h2 }}px; line-height:1.15; letter-spacing:-0.02em; color:#17331F;">{{ titleStart }} <span style="color:#758434;">{{ titleHighlight }}</span></h2>
      <p style="margin:0; max-width:{{ subMax }}; font-family:Montserrat, sans-serif; font-weight:500; font-size:{{ subSize }}px; line-height:1.6; color:#4D4D4A;">{{ subtitle }}</p>
    </header>
    <p aria-live="polite" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">{{ countText }}</p>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
      <ul style="list-style:none; margin:0; padding:0; display:grid; grid-template-columns:{{ cols }}; gap:{{ gridGap }}px;">
        <sc-for list="{{ items }}" as="n" hint-placeholder-count="9">
          <li style="display:flex;">
            <article style="width:100%; display:flex; flex-direction:column; border-radius:20px; overflow:hidden; background:#FFFFFF; box-shadow:0 1px 2px rgba(17,38,23,0.04);">
              <div data-shine="" style="position:relative; height:{{ imgH }}px; background:#E2E2E2; display:flex; align-items:center; justify-content:center; flex:none;">
                <sc-if value="{{ n.hasImage }}" hint-placeholder-val="{{ false }}"><img src="{{ n.image }}" alt="{{ n.imageAlt }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
                <sc-if value="{{ n.noImage }}" hint-placeholder-val="{{ true }}"><i class="ph ph-image" aria-hidden="true" style="font-size:30px; color:#A9A9A6;"></i></sc-if>
              </div>
              <div style="flex:1; display:flex; flex-direction:column; gap:12px; padding:{{ bodyPad }};">
                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:12px; font-family:Montserrat, sans-serif;">
                  <span style="padding:4px 10px; border-radius:6px; background:{{ n.badgeBg }}; color:{{ n.badgeFg }}; font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase;">{{ n.type }}</span>
                  <span style="display:flex; align-items:center; gap:6px; font-weight:500; font-size:13px; color:#4D4D4A;"><i class="ph ph-calendar-blank" aria-hidden="true" style="font-size:14px;"></i><time>{{ n.date }}</time></span>
                </div>
                <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:{{ titleSize }}px; line-height:1.3; color:#17331F; text-wrap:pretty;"><a href="{{ n.href }}" style="color:inherit; text-decoration:none;" style-hover="text-decoration:underline;">{{ n.title }}</a></h3>
                <p style="margin:0; font-family:Montserrat, sans-serif; font-weight:500; font-size:14px; line-height:1.6; color:#4D4D4A; text-wrap:pretty;">{{ n.excerpt }}</p>
                <div style="margin-top:auto; padding-top:12px; display:flex;">
                  <dc-import name="Button" variant="secundario-claro" label="Leer noticia" href="{{ n.href }}" full-width="true" shadow="false" hint-size="100%,44px"></dc-import>
                </div>
              </div>
            </article>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; align-items:center; gap:12px; padding:72px 24px; border-radius:20px; background:#FFFFFF; text-align:center;">
        <i class="ph ph-magnifying-glass" aria-hidden="true" style="font-size:36px; color:#758434;"></i>
        <h3 style="margin:0; font-family:Poppins, sans-serif; font-weight:600; font-size:22px; color:#17331F;">No encontramos noticias</h3>
        <p style="margin:0; max-width:420px; font-family:Montserrat, sans-serif; font-weight:500; font-size:15px; line-height:1.6; color:#4D4D4A;">Prueba con otro tipo, otro año o una búsqueda diferente.</p>
      </div>
    </sc-if>
    <sc-if value="{{ hasPages }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:{{ pagTop }}px;">
        <dc-import name="Paginacion" page="{{ page }}" total="{{ totalPages }}" compact="{{ isMobile }}" on-change="{{ onPage }}" hint-size="100%,44px"></dc-import>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;perPage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9,&quot;min&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;titleStart&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Más&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleHighlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;noticias&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Actividades, obras y comunicados del Fondo, publicados el mismo día en que ocurren.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;filter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{status,year,query}&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{type,date,title,excerpt,year,image?,href}[]&quot;}}">
class Component extends DCLogic {
  state = { auto: 'laptop', page: 1, key: '' };
  rootRef = React.createRef();
  componentDidMount() {
    const el = this.rootRef.current;
    if (!window.ResizeObserver) return;
    if (!this._iv) this._iv = setInterval(() => { const n = this.rootRef.current; if (n && n !== this._obsEl) this.componentDidMount(); else if (n && this._measure) this._measure(n.offsetWidth); }, 400);
    if (!el) { this._rt = setTimeout(() => this.componentDidMount(), 100); return; }
    if (this.ro && this._obsEl === el) return;
    if (this.ro) this.ro.disconnect();
    this._obsEl = el;
    this._measure = (w) => {
      const d = w < 768 ? 'mobile' : w < 1680 ? 'laptop' : 'desktop';
      const cols = w < 768 ? 1 : w < 1100 ? 2 : 3;
      if (d !== this.state.auto || cols !== this.state.cols) this.setState({ auto: d, cols });
    };
    this.ro = new ResizeObserver(([e]) => this._measure(e.contentRect.width));
    this.ro.observe(el);
    this._measure(el.offsetWidth);
    if (!this._onWin) { this._onWin = () => { const n = this.rootRef.current; if (n && this._measure) this._measure(n.offsetWidth); }; window.addEventListener('resize', this._onWin); }
  }
  componentWillUnmount() { clearInterval(this._iv); this._onWin && window.removeEventListener('resize', this._onWin); this.ro && this.ro.disconnect(); }
  renderVals() {
    const p = this.props;
    const isAuto = !p.device || p.device === 'auto';
    const dev = isAuto ? this.state.auto : p.device;
    const m = dev === 'mobile', d = dev === 'desktop';
    const cols = isAuto ? (this.state.cols ?? 3) : (m ? 1 : 3);
    const N = 'Noticia', C = 'Comunicado';
    const all0 = p.items ?? [
      [N, '20 oct 2026', 'Capacitamos a productores de Checos en manejo de pastos', 'Más de 40 familias participaron en la jornada técnica realizada en el local comunal.'],
      [C, '17 oct 2026', 'Resultados de la licitación pública N° 009-2026', 'Publicamos el acta de otorgamiento de la buena pro y los pasos siguientes del proceso.'],
      [N, '12 oct 2026', 'Avanza la instalación de aulas prefabricadas en La Pampa', 'La obra beneficiará a estudiantes de nivel inicial del centro poblado.'],
      [C, '08 oct 2026', 'Horario de atención en oficina durante noviembre', 'Atenderemos de lunes a viernes en horario corrido durante todo el mes.'],
      [N, '03 oct 2026', 'Reunión informativa con autoridades de los centros poblados', 'Presentamos el avance de los proyectos y recogimos las prioridades de cada comunidad.'],
      [N, '28 set 2026', 'Culmina el mantenimiento del sistema de agua en Pacopampa', 'El sistema vuelve a abastecer de agua segura a las familias del caserío.'],
      [C, '22 set 2026', 'Convocatoria abierta para especialista en recursos humanos', 'Revisa los requisitos, el cronograma y cómo postular en la convocatoria.'],
      [N, '15 set 2026', 'Entregamos módulos de servicios higiénicos en La Granja', 'Los módulos mejoran las condiciones de salud de estudiantes y docentes.'],
      [N, '08 set 2026', 'Jornada de salud preventiva en la comunidad de Checos', 'Médicos y enfermeras atendieron a familias de la comunidad durante dos días.'],
      [N, '30 ago 2026', 'Inauguramos el reservorio de riego en Pampa Grande', 'La obra permitirá ampliar las áreas de cultivo de las familias productoras.'],
      [C, '21 ago 2026', 'Actualización del Reglamento de Contrataciones', 'El nuevo reglamento ya está disponible en la sección de documentos.'],
      [N, '12 dic 2025', 'Cierre del año escolar con entrega de reconocimientos', 'Reconocimos a los estudiantes con mejor desempeño de la zona de influencia.']
    ].map(([type, date, title, excerpt]) => ({ type, date, title, excerpt, year: date.slice(-4) }));
    const all = all0.slice();
    const f = p.filter || {};
    const filtering = (f.status && f.status !== 'Todas') || (f.year && f.year !== 'todos') || (f.query || '').trim();
    if (filtering && p.featured) all.unshift({ year: String(p.featured.date || '').slice(-4), ...p.featured });
    const tmap = { 'Noticias': N, 'Comunicados': C };
    const q = (f.query || '').trim().toLowerCase();
    const list = all.filter(x => (!tmap[f.status] || x.type === tmap[f.status]) && (!f.year || f.year === 'todos' || x.year === f.year) && (!q || (x.title + ' ' + x.excerpt).toLowerCase().includes(q)));
    if (p.onTotal && this._tot !== list.length) { this._tot = list.length; const n = list.length; setTimeout(() => p.onTotal(n)); }
    const per = +(p.perPage ?? 9);
    const key = JSON.stringify(f);
    if (key !== this.state.key) setTimeout(() => this.setState({ key, page: 1 }));
    const totalPages = Math.max(1, Math.ceil(list.length / per));
    const page = Math.min(this.state.page, totalPages);
    const items = list.slice((page - 1) * per, page * per).map(x => ({ image: '', imageAlt: '', ...x, href: (!x.href || x.href === '#') ? (x.type === C ? 'Comunicado%20Detalle.dc.html' : 'Noticia%20Detalle.dc.html') : x.href, hasImage: !!x.image, noImage: !x.image, badgeBg: x.type === C ? 'linear-gradient(135deg, #4C6E3B 0%, #32502A 55%, #22402A 100%)' : 'linear-gradient(135deg, #F4DC6A 0%, #ECC725 55%, #DDB71A 100%)', badgeFg: x.type === C ? '#FFFFFF' : '#17331F' }));
    return {
      rootRef: this.rootRef, isMobile: m, items, hasItems: items.length > 0, isEmpty: items.length === 0,
      countText: 'Mostrando ' + items.length + ' de ' + list.length + ' noticias',
      mx: { mobile: 20, laptop: 56, desktop: 160 }[dev], padT: m ? 40 : 72, padB: m ? 64 : 112,
      headGap: m ? 24 : 40, headDir: m ? 'column' : 'row', headAlign: m ? 'flex-start' : 'center', headInner: m ? 10 : 40,
      h2: m ? 28 : (d ? 52 : 44), subMax: m ? 'none' : '400px', subSize: m ? 15 : 16,
      cols: 'repeat(' + cols + ', minmax(0, 1fr))', gridGap: m ? 16 : 24,
      imgH: m ? 220 : (d ? 300 : 260), bodyPad: m ? '20px 20px 24px' : '20px 24px 24px', titleSize: m ? 16 : 17,
      page, totalPages, hasPages: totalPages > 1, pagTop: m ? 24 : 40,
      onPage: n => { this.setState({ page: n }); const el = this.rootRef.current; if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 16; window.__lenis ? window.__lenis.scrollTo(y) : window.scrollTo({ top: y, behavior: 'smooth' }); } },
      titleStart: p.titleStart ?? 'Más', titleHighlight: p.titleHighlight ?? 'noticias',
      subtitle: p.subtitle ?? 'Actividades, obras y comunicados del Fondo, publicados el mismo día en que ocurren.'
    };
  }
}
</script>
</body>
</html>
