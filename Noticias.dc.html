<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias · Fondo Social La Granja</title>
<meta name="description" content="Noticias y comunicados oficiales de la AFSLG.">
<meta name="theme-color" content="#17331F">
<link rel="icon" type="image/png" href="assets/isotipo-orquidea.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style id="afslg-critical">html{background:#FDFCF8}html:not(.afslg-done) main{opacity:0;animation:afslgFail 0s 7s forwards}@keyframes afslgFail{to{opacity:1}}</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./site.js?v=14"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<style>html{scrollbar-gutter:stable} html.lenis,html.lenis body{height:auto} .lenis.lenis-smooth{scroll-behavior:auto !important} body{margin:0;background:#E2E2E2;overflow-x:clip} a{color:#32502A} a:hover{color:#17331F}</style>
</helmet>
<div style="display:flex; justify-content:center; width:100%;">
  <main style="width:{{ frameW }}; flex:none; zoom:{{ scale }}; background:#FDFCF8;">
    <dc-import name="EncabezadoInterno" device="{{ device }}" active="Noticias" show-filters="true" filters="{{ chips }}" filter-label="{{ filterLabel }}" sheet-title="Filtrar noticias" years="{{ years }}" result-label="{{ resultLabel }}" search-placeholder="Buscar noticias o comunicados" status-prefix="Tipo" status-all-label="Todos" on-filter-change="{{ onFilter }}" breadcrumb="{{ breadcrumb }}" title="Noticias" subtitle="Entérate de las actividades, obras y comunicados del Fondo Social La Granja en nuestras comunidades." hint-size="100%,500px"></dc-import>
    <sc-if value="{{ showFeatured }}" hint-placeholder-val="{{ true }}"><dc-import name="NoticiaDestacada" device="{{ device }}" image-alt="Entrega de mochilas y útiles escolares a estudiantes de la I.E. Ciro Guevara Pérez" hint-size="100%,560px"></dc-import></sc-if>
    <dc-import name="GrillaNoticias" device="{{ device }}" filter="{{ filter }}" on-total="{{ onTotal }}" featured="{{ featured }}" hint-size="100%,2000px"></dc-import>
    <dc-import name="CtaCierre" device="{{ device }}" image="assets/fotos/noticias-cta.webp" image-alt="Equipo del Fondo Social La Granja con la comunidad" hint-size="100%,574px"></dc-import>
    <dc-import name="Footer" device="{{ device }}" hint-size="100%,804px"></dc-import>
  </main>
  <dc-import name="CookieBanner" style="position:absolute; width:0; height:0;" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;laptop&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { vw: window.innerWidth };
  componentDidMount() {
    this.onR = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onR);
    this.initLenis();
  }
  initLenis() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || this.lenis) return;
    if (!window.Lenis) { this.t = setTimeout(() => this.initLenis(), 200); return; }
    this.lenis = new window.Lenis({ lerp: 0.09, smoothWheel: true }); window.__lenis = this.lenis;
    const loop = t => { this.lenis && this.lenis.raf(t); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); clearTimeout(this.t); cancelAnimationFrame(this.raf); this.lenis && this.lenis.destroy(); window.__lenis = null; }
  renderVals() {
    const device = this.props.device ?? 'auto';
    const F = { mobile: 390, laptop: 1440, desktop: 1920 }[device];
    return {
      device, frameW: F ? F + 'px' : '100%', scale: F ? Math.min(1, this.state.vw / F) : 1,
      breadcrumb: [{ label: 'Noticias' }], chips: ['Todas', 'Noticias', 'Comunicados'], onFilter: f => this.setState({ filter: f }), filter: this.state.filter || {}, years: ['2026', '2025', '2024', '2023'], onTotal: n => this.setState({ total: n }), resultLabel: 'Ver ' + (this.state.total ?? 12) + ((this.state.total ?? 12) === 1 ? ' noticia' : ' noticias'), filterLabel: this.state.vw < 768 ? 'Busca o filtra las noticias' : 'Filtra por tipo y año',
      showFeatured: (() => { const f = this.state.filter || {}; return !((f.status && f.status !== 'Todas') || (f.year && f.year !== 'todos') || (f.query || '').trim()); })(),
      featured: { type: 'Noticia', date: '24 oct 2026', title: 'Entregamos kits escolares a estudiantes de nuestra zona de influencia', excerpt: 'Los kits llegaron a las instituciones educativas de los centros poblados para el inicio del año escolar.', imageAlt: 'Entrega de mochilas y útiles escolares a estudiantes de la I.E. Ciro Guevara Pérez' }
    };
  }
}
</script>
</body>
</html>
